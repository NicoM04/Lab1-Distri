# Agente documentador (Rol 4). Independiente del CI principal (ci.yml):
# no comparte jobs ni condiciones con él. Revisa README(s) y CHANGELOG.md
# y abre issues de documentación cuando corresponde. Nunca escribe en main
# ni fusiona nada.
name: agent-documenter

on:
  schedule:
    # Todos los lunes a las 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo dry-run (no escribe en GitHub)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'nbody_2d/README.md'
      - 'nbody_2d/tests/README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: agent-documenter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-documenter:
    name: Ejecutar agente documentador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run documenter agent
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN_INPUT}" = "true" ]; then
            python scripts/agents/documenter.py --dry-run
          else
            python scripts/agents/documenter.py
          fi
